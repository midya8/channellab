[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "channellab-finite"
version = "0.1.0"
description = "Exact finite binary experiment comparison with garbling and decision witnesses"
requires-python = ">=3.10"
license = {text = "MIT"}
[project.scripts]
channellab = "channellab.__main__:main"
[tool.setuptools]
packages = ["channellab"]
